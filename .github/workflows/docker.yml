name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag rules:
          #   - main → "latest" + commit SHA short
          #   - vX.Y.Z tag → "X.Y.Z", "X.Y", "X", "latest"
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 런타임 설정 주입(/config.js)은 컨테이너를 실제로 띄워야만 검증된다.
      # 과거 이 층에서 두 번 조용히 깨졌다(sed 치환 무효화 / readOnly 루트 기동
      # 실패). push 전에 게이트로 돌려서 깨진 이미지가 GHCR 에 올라가지 않게 한다.
      # amd64 단일 플랫폼으로 로컬 로드 — 아래 멀티아치 빌드와 캐시를 공유한다.
      - name: Build (amd64, local) for runtime-config verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: matrix-client-verify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime config injection
        env:
          IMAGE: matrix-client-verify:ci
        run: scripts/verify-runtime-config.sh

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
