apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "matrix-client.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "matrix-client.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matrix-client.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "matrix-client.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # nginx needs writable /var/cache/nginx and /var/run with
          # readOnlyRootFilesystem=true — wire up emptyDirs.
          #
          # /run/matrix-client is where the entrypoint writes config.js when
          # the html dir is read-only; nginx serves that file as /config.js.
          # Without this mount DEFAULT_HOMESERVER is silently ignored
          # (measured: the old sed-based entrypoint crashed the pod outright).
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: runtime-config
              mountPath: /run/matrix-client
          {{- if .Values.config.defaultHomeserver }}
          # Optional: set the first-load homeserver default at startup.
          # The image's /docker-entrypoint.d/40-runtime-config.sh reads this
          # env var and writes /config.js, which index.html loads before the
          # app bundle — no rebuild, no postStart race.
          env:
            - name: DEFAULT_HOMESERVER
              value: {{ .Values.config.defaultHomeserver | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
