# Default values for matrix-client.
# Override on the command line with --set or via -f my-values.yaml.

image:
  repository: ghcr.io/krisamin/matrix-client
  tag: ""              # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

replicaCount: 1

# Pod-level resource requests/limits. Tune for your cluster — the SPA is
# tiny (nginx + ~70KB gzipped JS) so very small requests are fine.
resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 200m
    memory: 64Mi

service:
  type: ClusterIP
  port: 80

# Public URL. Disable to skip Ingress and expose via your own gateway.
ingress:
  enabled: false
  className: ""        # e.g. "nginx", "traefik"
  annotations: {}
  hosts:
    - host: chat.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - hosts: [chat.example.com]
    #   secretName: chat-example-com-tls

# Default homeserver injected at startup (written to /config.js by the
# container entrypoint, loaded by index.html before the app bundle).
# The SPA stores per-user overrides in localStorage; this only sets the
# *first-load* default. Leave "" to keep the built-in default (matrix.org).
#
# A bare server name is preferred over a URL — the client resolves the real
# API base URL via .well-known delegation, so "example.com" keeps the login
# form showing your apex even when the API lives on matrix.example.com.
config:
  defaultHomeserver: ""   # e.g. "example.com"

# Pod-level overrides
podAnnotations: {}
podSecurityContext:
  fsGroup: 101
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
