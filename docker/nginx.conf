server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Aggressive cache for hashed asset bundles.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # 빌드 때 만들어둔 .gz를 그대로 전송 (아래 gzip_static on).
    try_files $uri =404;
  }

  # SPA fallback: any non-asset 404 reroutes to index.html so client-side
  # routing handles /room/:id, /verify, /oidc/callback, etc.
  # index.html은 no-cache 필수 — Cache-Control 없으면 모바일 브라우저가
  # 휴리스틱 캐시로 옛 HTML(옛 번들 해시)을 재사용해 배포가 반영 안 됨.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Service worker scope must match where it's served.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Reasonable defaults
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ★WASM은 gzip_types에 없어서 5.4MB가 무압축으로 나갔다 (2026-08 실측).
  #   matrix_sdk_crypto_wasm은 gzip 시 1.77MB — 3.6MB 절감(67%).
  #   런타임 gzip은 요청마다 5MB를 압축해 CPU를 태우므로, 빌드 때 미리
  #   만들어 둔 .gz를 그대로 내보내는 gzip_static을 쓴다 (nginx -V로
  #   --with-http_gzip_static_module 확인 완료).
  #   .gz가 없으면 자동으로 원본 fallback이라 안전하다.
  gzip_static on;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/wasm
    image/svg+xml;
}
